name: LMS checks

# apps/lms + packages/db: typecheck, lint, tests (real Postgres), dependency
# audit, secret scan and env-file hygiene. The audit also runs nightly so new
# advisories surface without a code change. Vercel builds previews separately.
on:
  pull_request:
    paths:
      - "apps/lms/**"
      - "packages/db/**"
      - "packages/tsconfig/**"
      - "packages/eslint-config-custom/**"
      - "yarn.lock"
      - "package.json"
      - ".github/workflows/lms-checks.yml"
  push:
    branches: [main]
    paths:
      - "apps/lms/**"
      - "packages/db/**"
      - "yarn.lock"
      - "package.json"
      - ".github/workflows/lms-checks.yml"
  schedule:
    - cron: "30 1 * * *" # 03:30 SAST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        # Throwaway CI-only database inside the job container; not a secret.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci-only-not-a-secret@localhost:5432/postgres
      DATABASE_SSL: disable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: |
          yarn workspace db typecheck
          yarn workspace lms typecheck
      - name: Lint
        run: |
          yarn workspace db lint
          yarn workspace lms lint
      - name: Schema drift (migrations match the schema)
        working-directory: packages/db
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::src/schema changed without a committed migration (yarn db:generate)."
            git status --porcelain migrations
            exit 1
          fi
      - name: Tests (packages/db)
        run: yarn workspace db test
      - name: Tests (apps/lms, incl. restore test and answer-key boundary)
        run: yarn workspace lms test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Dependency audit (high/critical in lms and db production deps)
        run: node apps/lms/scripts/audit-deps.mjs

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No env files with values are tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::Tracked env files: $bad"; exit 1; fi
          for f in apps/lms/.env.example packages/db/.env.example; do
            if grep -nE '^[A-Z0-9_]+=.+' "$f"; then echo "::error::$f must list names only (no values)."; exit 1; fi
          done
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner \
            --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || '-1' }}"
